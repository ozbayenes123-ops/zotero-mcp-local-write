name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Bagimliliklari kur
        run: uv sync
      - name: CLI calisiyor mu
        run: uv run --no-sync zotero-mcp --help
      - name: Paket import edilebiliyor mu
        run: uv run --no-sync python -c "import zotero_mcp; print('zotero_mcp ok')"
