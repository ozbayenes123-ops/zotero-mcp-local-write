[project]
name = "zotero-mcp"
version = "0.4.0"
description = "Model Context Protocol server for Zotero (local fork with write support)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<3,>=2",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "pyzotero>=1.6.8",
]

[project.scripts]
zotero-mcp = "zotero_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zotero_mcp"]
